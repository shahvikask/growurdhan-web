name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required paths exist
        run: |
          set -e
          for p in index.html assets/site.css assets/banner.js assets/phone-slides.html privacy/index.html terms/index.html delete-account/index.html security/index.html faq/index.html sitemap.xml robots.txt; do
            test -f "$p"
          done
      - name: Canonical host is HTTPS
        run: |
          if grep -R --exclude-dir=.github --include='*.html' --include='*.xml' --include='robots.txt' --include='*.md' -n 'http://growurdhan.com' .; then
            echo "Canonical pages must use https://growurdhan.com"
            exit 1
          fi
      - name: No unfinished placeholder copy
        run: |
          if grep -R --include='*.html' -n 'Product screens rotate on the full page' .; then
            echo "Homepage still contains development placeholder text"
            exit 1
          fi
      - name: No email capture form
        run: |
          if grep -R --include='*.html' -n 'type="email"' .; then
            echo "Do not add an email capture form."
            exit 1
          fi

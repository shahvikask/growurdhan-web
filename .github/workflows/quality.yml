name: Quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required paths exist
        run: |
          set -e
          for p in index.html assets/site.css assets/product.css assets/banner.js assets/phone-slides.html privacy/index.html terms/index.html delete-account/index.html security/index.html faq/index.html family/index.html features/index.html how-it-works/index.html pricing/index.html guides/index.html guides/cas-statement/index.html sitemap.xml robots.txt CNAME; do
            test -f "$p"
          done
      - name: Canonical host is HTTP
        run: |
          if grep -R --exclude-dir=.github --include='*.html' --include='*.xml' --include='robots.txt' --include='*.md' -n -E 'https://(www\.)?growurdhan\.com' .; then
            echo "Use http://www.growurdhan.com in canonicals, sitemap, and docs"
            exit 1
          fi
      - name: Every HTML page has an HTTP canonical
        run: |
          set -e
          missing=0
          while IFS= read -r f; do
            if ! grep -q 'rel="canonical" href="http://www.growurdhan.com' "$f"; then
              echo "Missing HTTP canonical: $f"
              missing=1
            fi
          done < <(find . -name '*.html' -not -path './.github/*' -not -path './assets/*')
          test "$missing" -eq 0
      - name: No unfinished placeholder copy
        run: |
          if grep -R --include='*.html' --include='*.js' -n -E 'Product screens rotate on the full page|Dummy household|dummy UI' .; then
            echo "Placeholder or dummy-UI copy is still visible"
            exit 1
          fi
      - name: Homepage ships a coded phone, not personal screenshots
        run: |
          set -e
          grep -q 'data-carousel' index.html
          grep -q 'data-slide' assets/phone-slides.html
          test "$(grep -c 'data-slide' assets/phone-slides.html)" -ge 6
          grep -q '₹1.86 Cr' assets/phone-slides.html
          grep -q 'tabbar four' assets/phone-slides.html
          if grep -R --include='*.html' --include='*.js' --include='*.md' -n -E 'app-ui/|₹2,61,16,000|₹3,07,15,934|₹2\.61 Cr|₹3\.07 Cr' .; then
            echo "Personal screenshot figures or image paths are still published"
            exit 1
          fi
          if find assets \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) | grep -q .; then
            echo "Do not publish screenshot images"
            exit 1
          fi
      - name: Primary nav pages exist
        run: |
          for href in features family how-it-works security pricing faq guides; do
            test -f "$href/index.html"
          done
      - name: Sitemap and robots use HTTP
        run: |
          grep -q 'http://www.growurdhan.com/sitemap.xml' robots.txt
          grep -q 'http://www.growurdhan.com/guides/' sitemap.xml
          if grep -E -q 'https://(www\.)?growurdhan\.com' sitemap.xml; then
            echo "sitemap still has https"
            exit 1
          fi
      - name: No email capture form
        run: |
          if grep -R --include='*.html' -n 'type="email"' .; then
            echo "Do not add an email capture form."
            exit 1
          fi
      - name: HTML documents declare language and viewport
        run: |
          set -e
          while IFS= read -r f; do
            grep -q 'lang="en"' "$f"
            grep -q 'name="viewport"' "$f"
            grep -q 'class="skip"' "$f"
            grep -q 'id="main"' "$f"
          done < <(find . -name '*.html' -not -path './.github/*' -not -path './assets/*')
      - name: Banner script still owns menu and demo
        run: |
          grep -q 'data-menu' assets/banner.js
          grep -q 'data-demo' assets/banner.js
          grep -q 'Household net worth' assets/banner.js
      - name: No internal review copy on the site
        run: |
          if grep -R --include='*.html' -n 'homepage should feel' .; then
            echo "Internal review sentence is visible to visitors"
            exit 1
          fi
      - name: Key pages have a meta description
        run: |
          set -e
          for p in index.html features/index.html family/index.html how-it-works/index.html security/index.html pricing/index.html faq/index.html about/index.html privacy/index.html terms/index.html delete-account/index.html guides/index.html guides/cas-statement/index.html; do
            grep -q 'name="description"' "$p"
          done
      - name: Local links resolve
        run: python3 .github/check_site.py
